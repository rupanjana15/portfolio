<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="800" fill="#0d0f0c"/>

  <!-- Terms of Service page -->
  <rect x="90" y="90" width="560" height="620" rx="10" fill="#f2f0ea"/>
  <text x="130" y="150" font-size="26" font-weight="700" fill="#1a1a1a">Terms of Service</text>
  <text x="130" y="182" font-size="15" fill="#8a8780">Section 14 · Disputes</text>
  <g fill="#d6d3cb">
    <rect x="130" y="220" width="480" height="12" rx="6"/>
    <rect x="130" y="246" width="440" height="12" rx="6"/>
    <rect x="130" y="272" width="460" height="12" rx="6"/>
    <rect x="130" y="298" width="300" height="12" rx="6"/>
  </g>
  <rect x="116" y="334" width="508" height="140" rx="6" fill="#c8ff65" fill-opacity=".55"/>
  <g font-size="21" fill="#1a1a1a">
    <text x="130" y="370">Any dispute will be resolved by binding</text>
    <text x="130" y="402">arbitration, and you waive any right to</text>
    <text x="130" y="434">take part in a class action against us.</text>
  </g>
  <g fill="#d6d3cb">
    <rect x="130" y="508" width="470" height="12" rx="6"/>
    <rect x="130" y="534" width="420" height="12" rx="6"/>
    <rect x="130" y="560" width="480" height="12" rx="6"/>
    <rect x="130" y="586" width="360" height="12" rx="6"/>
    <rect x="130" y="630" width="450" height="12" rx="6"/>
    <rect x="130" y="656" width="250" height="12" rx="6"/>
  </g>

  <!-- connector -->
  <path d="M624 404 C 680 404, 680 300, 720 300" fill="none" stroke="#c8ff65" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Model flag -->
  <rect x="720" y="170" width="400" height="290" rx="10" fill="#171a14" stroke="#2f3628"/>
  <text x="750" y="214" font-size="15" letter-spacing="2" fill="#8f9a80">FLAG</text>
  <rect x="1010" y="194" width="80" height="28" rx="14" fill="#ff6b5b"/>
  <text x="1050" y="214" font-size="15" font-weight="700" fill="#1a0b09" text-anchor="middle">bad</text>
  <text x="750" y="262" font-size="24" font-weight="600" fill="#c8ff65">dispute_resolution</text>
  <g font-size="19" fill="#d8d6cf">
    <text x="750" y="310">You can't take them to court</text>
    <text x="750" y="338">or join a class action.</text>
  </g>
  <text x="750" y="396" font-size="15" fill="#8f9a80">quote copied exactly ✓</text>
  <text x="750" y="424" font-size="15" fill="#8f9a80">Qwen2.5-3B · QLoRA fine-tune</text>

  <!-- Grade -->
  <rect x="720" y="490" width="400" height="220" rx="10" fill="#171a14" stroke="#2f3628"/>
  <text x="750" y="534" font-size="15" letter-spacing="2" fill="#8f9a80">OVERALL GRADE</text>
  <text x="750" y="660" font-size="120" font-weight="700" fill="#f2f0ea">D</text>
  <g font-size="17" fill="#d8d6cf">
    <text x="880" y="600">A–E for the</text>
    <text x="880" y="630">whole document</text>
    <text x="880" y="660">runs on a laptop</text>
  </g>
</svg>
